  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#17324d">
    <text x="940" y="244">$3,900</text>
    <text x="940" y="304">$720</text>
    <text x="940" y="364">$280</text>
    <text x="940" y="424">$640</text>
  </g>
  <rect x="634" y="474" width="360" height="1" fill="#dbe6e0"/>
  <text x="634" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#17324d">Estimated total</text>
  <text x="880" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#0f766e">$5,540</text>
