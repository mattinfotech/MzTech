<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">AI quotation builder screen</title>
  <desc id="desc">Quotation builder mockup with line items, margin controls, and generated estimate total.</desc>
  <rect width="1200" height="750" fill="#f8f5ef"/>
  <rect x="86" y="72" width="1028" height="604" rx="20" fill="#ffffff" stroke="#eadfc9"/>
  <text x="128" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#143f46">Quotation Builder</text>
  <rect x="128" y="176" width="646" height="420" rx="16" fill="#ffffff" stroke="#e1e8e6"/>
  <rect x="128" y="176" width="646" height="56" rx="16" fill="#143f46"/>
  <text x="160" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Generated line items</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#53726d">
    <text x="160" y="276">Cabinet assembly</text>
    <text x="160" y="338">Hardware package</text>
    <text x="160" y="400">Installation labor</text>
    <text x="160" y="462">Delivery and handling</text>
  </g>
  <g fill="#0f766e">
    <rect x="430" y="260" width="118" height="16" rx="8" opacity="0.85"/>
    <rect x="430" y="322" width="164" height="16" rx="8" opacity="0.65"/>
    <rect x="430" y="384" width="220" height="16" rx="8" opacity="0.8"/>
    <rect x="430" y="446" width="96" height="16" rx="8" opacity="0.45"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#143f46">
    <text x="660" y="276">$4,280</text>
    <text x="660" y="338">$1,340</text>
    <text x="660" y="400">$2,120</text>
    <text x="660" y="462">$460</text>
  </g>
  <rect x="820" y="176" width="252" height="174" rx="16" fill="#e9f8f4"/>
  <text x="850" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#143f46">Estimate Total</text>
  <text x="850" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f766e">$8,200</text>
  <rect x="820" y="382" width="252" height="214" rx="16" fill="#fff8e6" stroke="#f0d99d"/>
  <text x="850" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#143f46">Review Controls</text>
  <rect x="850" y="464" width="170" height="12" rx="6" fill="#f59e0b"/>
  <circle cx="982" cy="470" r="18" fill="#143f46"/>
  <rect x="850" y="522" width="148" height="12" rx="6" fill="#0f766e" opacity="0.68"/>
  <circle cx="934" cy="528" r="18" fill="#143f46"/>
</svg>